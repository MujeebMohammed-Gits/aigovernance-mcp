[mypy]
python_version = 3.11
ignore_missing_imports = True
follow_imports = skip
show_error_codes = True
warn_unused_configs = True

# Only type-check core production modules
files = audit/*.py, agent_registry/*.py, provider_config/*.py, mcp_service/*.py

# Exclude everything else (single-line regex only)
exclude = ^config/.*|^confluence_integration\.py|^slack_integration\.py|^audit/.*original\.py|^audit/.*new\.py|^policy_engine/.*|^integration/.*|^usage_tracker/.*|^deployments/.*|^internal_llm_api/.*|^dashboard/.*|^temp.*|^.*demo.*|^run_mcp_test\.py|^run_cicd\.py|^create_cicd\.py|^fix_script\.py|^test_b64\.py|^write_cfg\.py|^temp_build\.py

allow_untyped_defs = True
allow_untyped_calls = True
allow_untyped_globals = True

explicit_package_bases = True
namespace_packages = True
