[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False
warn_no_return = False

# Avoid duplicate module errors
explicit_package_bases = True

# Allow imports even if stubs are missing
ignore_missing_imports = True

# Treat top-level directory as a package root
namespace_packages = True

# Disallow implicit optional types
no_implicit_optional = True

# Show error codes for clarity
show_error_codes = True

# Follow imports but don't type-check external libs
follow_imports = silent

# Exclude temp or non-production scripts
exclude = (
    temp\.py|
    temp_build\.py|
    test_b64\.py|
    write_cfg\.py|
    fix_script\.py|
    create_cicd\.py|
    run_cicd\.py
)

# Allow untyped defs in legacy modules
allow_untyped_defs = True
allow_untyped_calls = True
allow_untyped_globals = True

# Make mypy less strict for your integration modules
[mypy-confluence_integration.*]
ignore_errors = True

[mypy-jira_integration.*]
ignore_errors = True

[mypy-slack_integration.*]
ignore_errors = True

[mypy-provider_config.*]
ignore_errors = True
