[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = False
warn_no_return = False

# Avoid duplicate module errors
explicit_package_bases = True
namespace_packages = True

# Allow imports even if stubs are missing
ignore_missing_imports = True

# Follow imports but don't type-check external libs
follow_imports = silent

# Disallow implicit optional types
no_implicit_optional = True

# Show error codes
show_error_codes = True

# Exclude temp or non-production scripts (REGEX)
exclude = temp\.py|temp_build\.py|test_b64\.py|write_cfg\.py|fix_script\.py|create_cicd\.py|run_cicd\.py

# Allow untyped defs in legacy modules
allow_untyped_defs = True
allow_untyped_calls = True
allow_untyped_globals = True

# Ignore errors in integration modules
[mypy-confluence_integration.*]
ignore_errors = True

[mypy-jira_integration.*]
ignore_errors = True

[mypy-slack_integration.*]
ignore_errors = True

[mypy-provider_config.*]
ignore_errors = True
