name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  DEV_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aigovernance-dev
  STAGING_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aigovernance-staging
  PROD_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aigovernance-prod
  PYTHON_VERSION: "3.11"
  PROJECT_ROOT: /
  REQUIREMENTS_FILE: requirements.txt

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Clear mypy cache
        run: rm -rf .mypy_cache || true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F6,F7,W501 --show-source --statistics

      - name: Type check with mypy
        run: |
          mypy .

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: tests/
          retention-days: 30

  build:
    name: Build Docker Image
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      dev_image: ${{ steps.set-vars.outputs.dev_image }}
      staging_image: ${{ steps.set-vars.outputs.staging_image }}
      prod_image: ${{ steps.set-vars.outputs.prod_image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # DEV IMAGE
      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DEV_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.DEV_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.DEV_IMAGE }}:buildcache,mode=max

     # STAGING IMAGE
      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.STAGING_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.STAGING_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.STAGING_IMAGE }}:buildcache,mode=max

        # PROD IMAGE
      - name: Build and push prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.PROD_IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.PROD_IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.PROD_IMAGE }}:buildcache,mode=max

      - name: Set build vars
        id: set-vars
        run: |
          echo "dev_image=${{ env.DEV_IMAGE }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "staging_image=${{ env.STAGING_IMAGE }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "prod_image=${{ env.PROD_IMAGE }}:${{ github.sha }}" >> $GITHUB_OUTPUT

  deploy-dev:
    name: Deploy to Development
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker Engine & Compose
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version
          docker compose version

      - name: Deploy to dev environment
        run: |
          docker compose -f docker-compose.dev.yml config
          docker compose -f docker-compose.dev.yml up -d
        env:
          DEV_IMAGE: ${{ needs.build.outputs.dev_image }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Inspect dev deployment
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml ps -a
          docker compose -f docker-compose.dev.yml logs --no-color

      - name: Wait for dev service
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Development service is healthy"
            exit 0
          fi

            echo "Waiting for development service..."
            sleep 2
          done

          echo "Development service did not become healthy"
          docker compose -f docker-compose.dev.yml ps -a
          docker compose -f docker-compose.dev.yml logs --no-color
          exit 1

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker & Compose
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          docker --version
          docker compose version

      - name: Deploy to staging environment
        run: |
          docker compose -f docker-compose.staging.yml up -d
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Verify staging deployment
        run: |
          docker ps --filter "name=aigovernance-staging"

      - name: Run staging smoke tests
        run: |
          curl -f http://localhost:8000/health || exit 1

  deploy-prod:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: "production"
      url: https://aigovernance.example.com
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker & Compose
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          docker --version
          docker compose version

      - name: Deploy to production environment
        run: |
          docker compose -f docker-compose.prod.yml up -d
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Verify production deployment
        run: |
          docker ps --filter "name=aigovernance-prod"

      - name: Run post-deployment health checks
        run: |
          curl -f https://aigovernance.example.com/health || exit 1

      - name: Notify deployment success
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: "✅ Production deployment successful! SHA: ${{ github.sha }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  promote-environments:
    name: Promote Environments
    needs: [deploy-dev, deploy-staging, deploy-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check promotion status
        run: |
          echo "Environments promoted successfully:"
          echo "- Development: ✅ Deployed"
          echo "- Staging: ✅ Deployed"
          echo "- Production: ✅ Deployed"
          echo "Promotion complete for SHA: ${{ github.sha }}"

  rolling-deploy:
    name: Rolling Deployment Strategy
    needs: deploy-prod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker & Compose
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          docker --version
          docker compose version

      - name: Execute rolling deployment
        run: |
          echo "Starting rolling deployment sequence..."
          echo "1. Deploy to Development"
          docker compose -f docker-compose.dev.yml up -d
          echo "2. Wait for health checks"
          sleep 60
          echo "3. Deploy to Staging"
          docker compose -f docker-compose.staging.yml up -d
          echo "4. Wait for staging validation"
          sleep 120
          echo "5. Deploy to Production"
          docker compose -f docker-compose.prod.yml up -d
          echo "6. Monitor production health"
          sleep 180
          echo "7. Rolling deployment complete"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: "🔄 Rolling deployment completed for SHA: ${{ github.sha }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  rollback-automation:
    name: Rollback Automation
    needs: [deploy-dev, deploy-staging, deploy-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install deployment tools
        run: |
          pip install docker-compose
          
      - name: Execute rollback on failure
        run: |
          echo "⚠️ Deployment failure detected - initiating rollback..."
          echo "Rolling back to previous stable version..."
          docker compose -f docker-compose.prod.yml down
          echo "Rollback complete. Manual verification required."

      - name: Send Slack alert on failure
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: "⚠️ Deployment failed for SHA: ${{ github.sha }}. Rollback initiated. Check logs for details."
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
