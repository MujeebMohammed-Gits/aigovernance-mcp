name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
  DEV_IMAGE_BASE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aigovernance-dev
  STAGING_IMAGE_BASE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aigovernance-staging
  PROD_IMAGE_BASE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/aigovernance-prod
  PYTHON_VERSION: "3.11"
  PROJECT_ROOT: /
  REQUIREMENTS_FILE: requirements.txt

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - name: Clear mypy cache
        run: rm -rf .mypy_cache || true

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.REQUIREMENTS_FILE }}

      - name: Lint with flake8
        run: flake8 . --count --select=E9,F6,F7,W501 --show-source --statistics

      - name: Type check with mypy
        run: mypy .

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: tests/
          retention-days: 30

  build:
    name: Build & Push Docker Images
    needs: lint-test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    outputs:
      dev_image: ${{ steps.set-outputs.outputs.dev_image }}
      staging_image: ${{ steps.set-outputs.outputs.staging_image }}
      prod_image: ${{ steps.set-outputs.outputs.prod_image }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.DEV_IMAGE_BASE }}:${{ github.sha }}

      - name: Build and push staging image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.STAGING_IMAGE_BASE }}:${{ github.sha }}

      - name: Build and push prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.PROD_IMAGE_BASE }}:${{ github.sha }}

      - name: Set image outputs
        id: set-outputs
        run: |
          echo "dev_image=${{ env.DEV_IMAGE_BASE }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "staging_image=${{ env.STAGING_IMAGE_BASE }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "prod_image=${{ env.PROD_IMAGE_BASE }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Export images to env
        run: |
          echo "DEV_IMAGE=${{ env.DEV_IMAGE_BASE }}:${{ github.sha }}" >> $GITHUB_ENV
          echo "STAGING_IMAGE=${{ env.STAGING_IMAGE_BASE }}:${{ github.sha }}" >> $GITHUB_ENV
          echo "PROD_IMAGE=${{ env.PROD_IMAGE_BASE }}:${{ github.sha }}" >> $GITHUB_ENV

  deploy-dev:
    name: Deploy to Development
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development

    env:
      DEV_IMAGE: ${{ needs.build.outputs.dev_image }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker & Compose
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker compose version

      - name: Deploy to dev environment
        run: |
          test -n "$DEV_IMAGE" || {
            echo "DEV_IMAGE is empty"
            exit 1
          }

          echo "Deploying image: $DEV_IMAGE"
          docker compose -f docker-compose.dev.yml config
          docker compose -f docker-compose.dev.yml up -d --pull always

      - name: Wait for dev health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Development service is healthy"
              exit 0
            fi
            echo "Waiting for development service..."
            sleep 2
          done

          echo "Development service did not become healthy"
          docker compose -f docker-compose.dev.yml ps -a
          docker compose -f docker-compose.dev.yml logs --no-color
          exit 1

      - name: Inspect dev deployment
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml ps -a
          docker compose -f docker-compose.dev.yml logs --no-color

  deploy-staging:
    name: Deploy to Staging
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging

    env:
      STAGING_IMAGE: ${{ needs.build.outputs.staging_image }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker & Compose
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker compose version

      - name: Deploy to staging environment
        run: |
          test -n "$STAGING_IMAGE" || {
            echo "STAGING_IMAGE is empty"
            exit 1
          }

          echo "Deploying image: $STAGING_IMAGE"
          docker compose -f docker-compose.staging.yml config
          docker compose -f docker-compose.staging.yml up -d --pull always

      - name: Wait for staging health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Staging service is healthy"
              exit 0
            fi
            echo "Waiting for staging service..."
            sleep 2
          done

          echo "Staging service did not become healthy"
          docker compose -f docker-compose.staging.yml ps -a
          docker compose -f docker-compose.staging.yml logs --no-color
          exit 1

      - name: Inspect staging deployment
        if: always()
        run: |
          docker compose -f docker-compose.staging.yml ps -a
          docker compose -f docker-compose.staging.yml logs --no-color

  deploy-prod:
    name: Deploy to Production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://aigovernancetower.com

    env:
      PROD_IMAGE: ${{ needs.build.outputs.prod_image }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker & Compose
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker compose version

      - name: Deploy to production environment
        run: |
          test -n "$PROD_IMAGE" || {
            echo "PROD_IMAGE is empty"
            exit 1
          }

          echo "Deploying image: $PROD_IMAGE"
          docker compose -f docker-compose.prod.yml config
          docker compose -f docker-compose.prod.yml up -d --pull always

      - name: Wait for production health
        run: |
          for i in {1..30}; do
            if curl --fail --silent https://aigovernancetower.com/health; then
              echo "Production service is healthy"
              exit 0
            fi
            echo "Waiting for production service..."
            sleep 2
          done

          echo "Production service did not become healthy"
          docker compose -f docker-compose.prod.yml ps -a
          docker compose -f docker-compose.prod.yml logs --no-color
          exit 1

      - name: Inspect production deployment
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml ps -a
          docker compose -f docker-compose.prod.yml logs --no-color

      - name: Notify deployment success
        if: success()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: "✅ Production deployment successful! SHA: ${{ github.sha }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  rolling-deploy:
    name: Rolling Deployment Strategy (Main branch)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.ref == 'refs/heads/main'

    env:
      DEV_IMAGE: ${{ needs.build.outputs.dev_image }}
      STAGING_IMAGE: ${{ needs.build.outputs.staging_image }}
      PROD_IMAGE: ${{ needs.build.outputs.prod_image }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker & Compose
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker compose version

      - name: Rolling Deploy - Development
        run: |
          echo "Deploying to Development..."
          test -n "$DEV_IMAGE" || { echo "DEV_IMAGE is empty"; exit 1; }
          docker compose -f docker-compose.dev.yml config
          docker compose -f docker-compose.dev.yml up -d --pull always
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Development service is healthy"
              break
            fi
            echo "Waiting for development service..."
            sleep 2
          done
          docker compose -f docker-compose.dev.yml ps -a
          docker compose -f docker-compose.dev.yml logs --no-color

      - name: Rolling Deploy - Staging
        run: |
          echo "Deploying to Staging..."
          test -n "$STAGING_IMAGE" || { echo "STAGING_IMAGE is empty"; exit 1; }
          docker compose -f docker-compose.staging.yml config
          docker compose -f docker-compose.staging.yml up -d --pull always
          for i in {1..30}; do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Staging service is healthy"
              break
            fi
            echo "Waiting for staging service..."
            sleep 2
          done
          docker compose -f docker-compose.staging.yml ps -a
          docker compose -f docker-compose.staging.yml logs --no-color

      - name: Rolling Deploy - Production
        run: |
          echo "Deploying to Production..."
          test -n "$PROD_IMAGE" || { echo "PROD_IMAGE is empty"; exit 1; }
          docker compose -f docker-compose.prod.yml config
          docker compose -f docker-compose.prod.yml up -d --pull always
          for i in {1..30}; do
            if curl --fail --silent https://aigovernancetower.com/health; then
              echo "Production service is healthy"
              break
            fi
            echo "Waiting for production service..."
            sleep 2
          done
          docker compose -f docker-compose.prod.yml ps -a
          docker compose -f docker-compose.prod.yml logs --no-color

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: "🔄 Rolling deployment completed for SHA: ${{ github.sha }}"
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  rollback-automation:
    name: Rollback Automation
    needs: [deploy-dev, deploy-staging, deploy-prod]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: failure() && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Docker & Compose
        run: |
          curl -fsSL https://get.docker.com -o get-docker.sh
          sudo sh get-docker.sh
          sudo systemctl start docker
          docker --version
          docker compose version

      - name: Execute rollback on failure
        run: |
          echo "⚠️ Deployment failure detected - initiating rollback..."
          docker compose -f docker-compose.prod.yml down
          echo "Rollback complete. Manual verification required."

      - name: Send Slack alert on failure
        uses: slackapi/slack-github-action@v1.25.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL }}
          slack-message: "⚠️ Deployment failed for SHA: ${{ github.sha }}. Rollback initiated. Check logs for details."
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
