  #### 9. Development Docker Compose

  version: '3.8'

  services:
    mcp-server:
      build:
        context: .
        dockerfile: Dockerfile
      ports:
        - "8000:8000"
      environment:
        - OPENAI_API_KEY=${OPENAI_API_KEY}
        - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
        - GOOGLE_API_KEY=${GOOGLE_API_KEY}
        - DEBUG=True
        - LOG_LEVEL=DEBUG
        - HOST=0.0.0.0
        - PORT=8000
      volumes:
        - .:/app:ro  # Read-only to prevent accidental writes
      command: python -m server
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 30s
        timeout: 10s
        retries: 3
      labels:
        - "traefik.enable=true"
        - "traefik.port=8000"
        - "traefik.http.routers.mcp-dev.entrypoints=http"
        - "traefik.http.routers.mcp-dev.tls.certresolver=unused"

    # Optional: Redis for circuit breaker persistence
    redis:
      image: redis:7-alpine
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data
      restart: unless-stopped

  volumes:
    redis_data:
      driver: local

